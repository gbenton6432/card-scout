name: Check a listing

on:
  workflow_dispatch:
    inputs:
      item:
        description: eBay item number or listing link
        required: true

permissions:
  contents: write   # saves the result to the "checks" branch for the dashboard

concurrency:
  group: check-${{ inputs.item }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Measure the listing's photo
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITEM: ${{ inputs.item }}
        run: python tools/check_item.py "$ITEM" --save
