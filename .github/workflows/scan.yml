name: Scan eBay

on:
  schedule:
    - cron: "17 * * * *"     # hourly full scan (GitHub often starts these 10-30 minutes late)
    - cron: "47 * * * *"     # reminder check only: shortlisted auctions ending soon
  workflow_dispatch:          # "Run workflow" button for a scan on demand
  push:
    paths: ["config.yaml", "gem_rates.yaml"]   # rescan right after players or sets change

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write               # alerts are posted as issues

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # The listing database (every listing seen, measurements, sweep progress) carries over between runs
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: card-scout-${{ github.run_id }}
          restore-keys: card-scout-

      - name: Search eBay and measure centering
        id: scan
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          rm -rf site/demo site/data
          python scout.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cache
          key: card-scout-${{ github.run_id }}

      - uses: actions/configure-pages@v5
        if: steps.scan.outputs.ran == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.scan.outputs.ran == 'true'
        with:
          path: site
      - id: deploy
        if: steps.scan.outputs.ran == 'true'
        uses: actions/deploy-pages@v4
