# ─────────────────────────────────────────────────────────────
#  Card Scout settings — the only file you need to edit.
#  The scanner pairs every player with every qualifying set
#  from their years and searches eBay for each pair.
# ─────────────────────────────────────────────────────────────

# Sets at or above this PSA 10 gem rate are searched; lower ones are skipped.
gem_rate_min: 50
# Different cutoff for a sport (0 = no cutoff). Disney: every Topps Chrome Disney set counts.
gem_rate_min_by_sport:
  disney: 0

# ── Players / characters ──────────────────────────────────────
# sport must match the sport on the sets below (baseball, basketball,
# football, soccer, hockey, pokemon...). years: "2018-" = 2018 to today.
# min_price / max_price are optional per-player overrides.
players:
  # jersey: the player's number(s), for jersey-match serials (e.g. 99/99 for Judge)
  - {name: Shohei Ohtani,   sport: baseball,   years: 2018-, jersey: [17]}
  - {name: Aaron Judge,     sport: baseball,   years: 2017-, jersey: [99]}
  - {name: LeBron James,    sport: basketball, years: 2003-, jersey: [23, 6]}
  - {name: Stephen Curry,   sport: basketball, years: 2009-, jersey: [30]}
  - {name: Patrick Mahomes, sport: football,   years: 2017-, jersey: [15]}
  - {name: Josh Allen,      sport: football,   years: 2018-, jersey: [17]}
  - {name: Caleb Williams,  sport: football,   years: 2022-, jersey: [18, 13]}
  - {name: Trinity Rodman,  sport: soccer,     years: 2021-, jersey: [2, 20, 22, 6]}
  - {name: Linda Caicedo,   sport: soccer,     years: 2023-, jersey: [18]}
  - {name: Cavan Sullivan,  sport: soccer,     years: 2024-, jersey: [6, 7]}
  - {name: Kylian Mbappe,   sport: soccer,     years: 2016-, jersey: [10, 9, 7, 29]}

  # Disney characters: Topps Chrome Disney sets only. "search" is what's typed into eBay
  # (after "Topps Chrome Disney"); "name" is the character as GemRate lists it.
  - {name: Mickey Mouse, sport: disney, years: 2023-, search: "Topps Chrome Disney Mickey", sets_only: [Topps Chrome Disney, Topps Chrome DISNEY100]}
  - {name: Minnie Mouse, sport: disney, years: 2023-, search: "Topps Chrome Disney Minnie", sets_only: [Topps Chrome Disney, Topps Chrome DISNEY100]}
  - {name: Buzz Lightyear, sport: disney, years: 2023-, search: "Topps Chrome Disney Buzz Lightyear", sets_only: [Topps Chrome Disney, Topps Chrome DISNEY100]}
  - {name: Woody, sport: disney, years: 2023-, search: "Topps Chrome Disney Woody", sets_only: [Topps Chrome Disney, Topps Chrome DISNEY100]}
  - {name: Elsa, sport: disney, years: 2023-, search: "Topps Chrome Disney Elsa", sets_only: [Topps Chrome Disney, Topps Chrome DISNEY100]}
  - {name: Anna, sport: disney, years: 2023-, search: "Topps Chrome Disney Anna", sets_only: [Topps Chrome Disney, Topps Chrome DISNEY100]}
  - {name: Stitch, sport: disney, years: 2023-, search: "Topps Chrome Disney Stitch", sets_only: [Topps Chrome Disney, Topps Chrome DISNEY100]}
  - {name: Goofy, sport: disney, years: 2023-, search: "Topps Chrome Disney Goofy", sets_only: [Topps Chrome Disney, Topps Chrome DISNEY100]}
  - {name: Pluto, sport: disney, years: 2023-, search: "Topps Chrome Disney Pluto", sets_only: [Topps Chrome Disney, Topps Chrome DISNEY100]}
  - {name: Cinderella, sport: disney, years: 2023-, search: "Topps Chrome Disney Cinderella", sets_only: [Topps Chrome Disney, Topps Chrome DISNEY100]}
  - {name: Snow White, sport: disney, years: 2023-, search: "Topps Chrome Disney Snow White", sets_only: [Topps Chrome Disney, Topps Chrome DISNEY100]}
  - {name: Moana, sport: disney, years: 2023-, search: "Topps Chrome Disney Moana", sets_only: [Topps Chrome Disney, Topps Chrome DISNEY100]}
  - {name: Donald Duck, sport: disney, years: 2023-, search: "Topps Chrome Disney Donald", sets_only: [Topps Chrome Disney, Topps Chrome DISNEY100]}
  - {name: Winnie the Pooh, sport: disney, years: 2023-, search: "Topps Chrome Disney Pooh", sets_only: [Topps Chrome Disney, Topps Chrome DISNEY100]}

# ── Which brands count ────────────────────────────────────────
# A set is used only if its name starts with one of these (Bowman, Finest,
# Stadium Club and Ben Baller are Topps brands; Donruss, Score and Playoff are
# Panini's). Players can override with their own sets_only list.
set_brands:
  sports: [Topps, Bowman, "Bowman's", Finest, Stadium Club, Ben Baller, Panini, Donruss, Score, Playoff]

# ── Extra sets (optional) ─────────────────────────────────────
# Gem rates for every set are kept in gem_rates.yaml automatically.
# Add a set here only if it's missing there, with its PSA 10 gem rate (%).
#   year:  as sellers write it, e.g. 2023 (2023-24 sets go in as 2023)
#   set:   the words sellers put in titles, e.g. Prizm, Topps Chrome Update
#   exclude (optional): words that mean a different product,
#          e.g. Prizm → [draft picks] so Prizm Draft Picks isn't counted
# Format:
#   - {year: 2018, set: Topps Chrome Update, sport: baseball, gem_rate: 48}
sets: []   # add a set here only if gem_rates.yaml is missing it, e.g. {year: 2024, set: X, sport: baseball, gem_rate: 55}

# Optional: one-off searches that don't fit the player × set pattern.
extra_searches: []
#  - name: Wemby Prizm Silver
#    player: Victor Wembanyama
#    year: 2023
#    set: Prizm Silver
#    query: "2023 prizm silver wembanyama rookie"
#    category: sports   # sports | tcg

# ── Applies to every search ──────────────────────────────────
defaults:
  raw_only: true              # ungraded cards only (no slabs)
  exclude_words: [psa, bgs, sgc, cgc, beckett, graded, lot, reprint, custom, proxy]
  min_price: 10
  max_price: 1000
  buying_options: [FIXED_PRICE, AUCTION]
  ship_to_country: US
  daily_call_limit: 5000      # raise this if eBay approves a higher limit

# ── Break-even ────────────────────────────────────────────────
# Each card shows the sale price you'd need, after eBay's fee, to get back
# what you paid plus grading. All-in grading cost per card (fees, shipping, insurance):
grading:
  tiers: {Value: 45, Value Bulk: 30}
  sell_fee_pct: 13.25

# ── Alerts ────────────────────────────────────────────────────
# Alerts arrive as GitHub issues: GitHub emails you, and the GitHub app
# sends a phone notification.
#  1. New Buy It Now listings that pass the rules below.
#  2. A reminder before any auction on your shortlist ends
#     (needs shortlist sync turned on in the dashboard — see README).
alerts:
  enabled: true
  psa10_centering_only: true  # must measure 55/45 or better
  max_times_typical_ask: 2    # skip cards priced over 2x the typical ask for the same card (blank = off)
  max_price: 500
  buy_it_now_only: true       # new auctions don't alert; shortlist them for a reminder instead
  auction_reminder_minutes: 75  # remind when a shortlisted auction has this long left (arrives ~45-75 min before)

# ── Consigner / big-dealer filtering ──────────────────────────
consigners:
  blocked_sellers: []         # eBay usernames to always exclude
  blocked_title_words: [consign, consignment, vault, pwcc, goldin, "fanatics collect", repack, mystery]
  max_seller_feedback: 25000  # above this = treated as a dealer/consigner. 0 = off
  max_listings_per_seller: 40 # one seller with more than this many of your players' listings = dealer. 0 = off

# ── Photo quality rules ───────────────────────────────────────
photos:
  min_photos: 2
  hide_low_confidence: false  # true = also hide cards whose centering couldn't be measured
  # A card is removed only when its photo is clear (confidence >= min_confidence_to_drop)
  # and its worse side is beyond psa10_max_split + tolerance (55 + 1.5 = worse than 56.5/43.5).
  psa10_max_split: 55
  tolerance: 1.5              # allowance for measurement error on good photos
  min_confidence_to_drop: 0.6
  measure_minutes: 40         # time per hourly run spent measuring new photos
  read_serials: true          # read serial-number stamps (e.g. 023/199) off sports card photos
